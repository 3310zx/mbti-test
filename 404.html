<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 - MBTI 认知功能测试</title>
<meta name="description" content="您访问的页面不存在或已被移动。返回 MBTI 认知功能测试首页，或使用语言切换选择您的语言版本。">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="canonical" href="https://3310zx.github.io/mbti-test/404.html">
<style>
  body { background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
  .wrap { padding: 48px 24px; max-width: 620px; }
  .code { font-size: 72px; font-weight: 700; letter-spacing: -2px; margin: 0 0 8px; }
  .msg { font-size: 28px; font-weight: 600; margin: 0 0 12px; }
  .desc { font-size: 17px; color: #6e6e73; line-height: 1.6; margin: 0 0 28px; }
  .btn { display: inline-block; background: #0071e3; color: #fff; text-decoration: none; font-size: 17px; font-weight: 500; padding: 12px 28px; border-radius: 980px; border: none; cursor: pointer; transition: background .2s; }
  .btn:hover { background: #0077ed; }
  .lang { margin-top: 24px; font-size: 14px; color: #6e6e73; }
  .lang select { margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d2d2d7; background: #fff; font-size: 14px; color: #1d1d1f; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <p class="msg">页面不存在</p>
  <p class="desc">您访问的页面不存在或已被移动，请返回首页继续测试，或选择您的语言。</p>

  <div class="lang">
    <label for="lang-switch">切换语言 / Language：</label><br>
    <select id="lang-switch" onchange="location.href=this.value">
      <option value="index.html">ZH</option><option value="en/index.html">EN</option><option value="ja/index.html">JA</option><option value="ko/index.html">KO</option><option value="fr/index.html">FR</option><option value="ru/index.html">RU</option><option value="es/index.html">ES</option><option value="pt/index.html">PT</option><option value="yue/index.html">YUE</option><option value="bo/index.html">BO</option>
    </select>
  </div>
</div>
