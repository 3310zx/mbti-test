<script>
/* MBTI Cognitive Function Test — static scoring endpoint (spec 1.0)
   Pure function computeScore(answers, lang) is shared verbatim with the
   specification in ai/spec.md and can be evaluated standalone (e.g. in node). */
var SPEC_VERSION = "1.0";
var SITE = "https://3310zx.github.io/mbti-test";
var QUESTIONS = [[1, "EI", 1], [2, "EI", -1], [3, "EI", 1], [4, "EI", -1], [5, "EI", 1], [6, "EI", -1], [7, "EI", 1], [8, "EI", -1], [9, "SN", 1], [10, "SN", -1], [11, "SN", 1], [12, "SN", -1], [13, "SN", 1], [14, "SN", -1], [15, "SN", 1], [16, "SN", -1], [17, "TF", 1], [18, "TF", -1], [19, "TF", 1], [20, "TF", -1], [21, "TF", 1], [22, "TF", -1], [23, "TF", 1], [24, "TF", -1], [25, "JP", 1], [26, "JP", -1], [27, "JP", 1], [28, "JP", -1], [29, "JP", 1], [30, "JP", -1], [31, "JP", 1], [32, "JP", -1], [33, "AT", 1], [34, "AT", 1], [35, "AT", 1], [36, "AT", -1], [37, "AT", -1], [38, "AT", -1]];   /* [id, dim, dir] — fixed order, id 1..38 */
var STACKS = {"ENFJ": ["Fe", "Ni", "Se", "Ti"], "ENFP": ["Ne", "Fi", "Te", "Si"], "ENTJ": ["Te", "Ni", "Se", "Fi"], "ENTP": ["Ne", "Ti", "Fe", "Si"], "ESFJ": ["Fe", "Si", "Ne", "Ti"], "ESFP": ["Se", "Fi", "Te", "Ni"], "ESTJ": ["Te", "Si", "Ne", "Fi"], "ESTP": ["Se", "Ti", "Fe", "Ni"], "INFJ": ["Ni", "Fe", "Ti", "Se"], "INFP": ["Fi", "Ne", "Si", "Te"], "INTJ": ["Ni", "Te", "Fi", "Se"], "INTP": ["Ti", "Ne", "Si", "Fe"], "ISFJ": ["Si", "Fe", "Ti", "Ne"], "ISFP": ["Fi", "Se", "Ni", "Te"], "ISTJ": ["Si", "Te", "Fi", "Ne"], "ISTP": ["Ti", "Se", "Ni", "Fe"]};
var TYPES = {"ENFJ": {"zh": "主人公", "en": "Protagonist", "dzh": "Fe 主导：擅长理解、感染并凝聚他人，是天生的组织者与激励者。Ni 辅助看清团队方向，乐于成就别人，社交中自带温暖气场。", "den": "Fe-dominant: naturally skilled at understanding, inspiring and bringing people together — a born organizer and motivator. Ni-auxiliary helps see the team’s direction, enjoys helping others succeed, and carries a warm presence in social settings."}, "ENFP": {"zh": "竞选者", "en": "Campaigner", "dzh": "Ne 主导：热情、好奇、脑洞大，对人和新事物充满兴趣。Fi 辅助在众多可能中捕捉真正打动自己的那一个，适合创意与连接型工作。", "den": "Ne-dominant: enthusiastic, curious and imaginative, endlessly interested in people and new things. Fi-auxiliary picks out what truly moves you from all the possibilities — a natural fit for creative and people-connecting work."}, "ENTJ": {"zh": "指挥官", "en": "Commander", "dzh": "Te 主导：执行力与组织力突出，善于调动资源、推进目标。Ni 辅助提供战略眼光，天生适合带团队和攻坚，讨厌失控与低效。", "den": "Te-dominant: outstanding execution and organizational ability, skilled at mobilizing resources and driving goals forward. Ni-auxiliary provides strategic vision — born to lead teams and tackle hard problems, with a low tolerance for chaos and inefficiency."}, "ENTP": {"zh": "辩论家", "en": "Debater", "dzh": "Ne 主导：思维活跃、点子层出不穷，喜欢挑战既有框架。Ti 辅助把想法打磨成严密论证，享受思想交锋，但对重复性事务缺乏耐心。", "den": "Ne-dominant: quick-minded with endless ideas, loves challenging established frameworks. Ti-auxiliary polishes ideas into rigorous arguments — enjoys intellectual sparring, but lacks patience for repetitive work."}, "ESFJ": {"zh": "执政官", "en": "Consul", "dzh": "Fe 主导：热心组织社群、协调关系，关注他人感受与和谐氛围。Si 辅助在熟悉圈子里游刃有余，是天然的\"润滑剂\"与召集人。", "den": "Fe-dominant: enthusiastic about organizing communities and harmonizing relationships, attentive to others’ feelings and a harmonious atmosphere. Si-auxiliary moves with ease in familiar circles — a natural “lubricant” and convener."}, "ESFP": {"zh": "表演者", "en": "Entertainer", "dzh": "Se 主导：热情外向，享受当下并感染周围人。Fi 辅助在热闹中保持对自我的忠诚，是气氛担当与体验派。", "den": "Se-dominant: warm and outgoing, enjoys the moment and lights up everyone around. Fi-auxiliary stays loyal to self amid the fun — the life of the party and a true experience-seeker."}, "ESTJ": {"zh": "总经理", "en": "Executive", "dzh": "Te 主导：务实高效，善于制定规则并推动执行。Si 辅助提供扎实的经验参照，适合管理和组织场景，重视秩序与结果。", "den": "Te-dominant: practical and efficient, skilled at setting rules and driving execution. Si-auxiliary provides solid experiential reference — a natural fit for management and organizing, valuing order and results."}, "ESTP": {"zh": "企业家", "en": "Entrepreneur", "dzh": "Se 主导：反应快、行动力强，擅长把握当下机会。Ti 辅助在实战中快速推理，喜欢刺激与挑战，天生适合高压应变场景。", "den": "Se-dominant: fast reflexes and strong drive, great at seizing opportunities in the moment. Ti-auxiliary reasons quickly in the heat of action — loves thrill and challenge, naturally built for high-pressure situations."}, "INFJ": {"zh": "提倡者", "en": "Advocate", "dzh": "Ni 主导：对人与事有深刻洞察和使命感，Fe 辅助敏锐体察他人情绪。理想主义且坚定，常常默默推动自己相信的改变。", "den": "Ni-dominant: deep insight into people and events with a sense of mission, Fe-auxiliary keenly attuned to others’ emotions. Idealistic yet determined, quietly driving the change they believe in."}, "INFP": {"zh": "调停者", "en": "Mediator", "dzh": "Fi 主导：价值观和个人信念是第一行动准则，忠于内心。Ne 辅助在理想与现实间探索可能性，同理心强，追求有意义的工作与生活。", "den": "Fi-dominant: values and personal beliefs are the first principle of action, true to the heart. Ne-auxiliary explores possibilities between ideals and reality, with strong empathy and a pursuit of meaningful work and life."}, "INTJ": {"zh": "建筑师", "en": "Architect", "dzh": "Ni 主导：习惯用直觉洞察全局与长远走向，Te 辅助把构想拆成可执行方案。独立、目标感强，倾向于自己把事想透再行动，对低效和含糊缺乏耐心。", "den": "Ni-dominant: uses intuition to see the big picture and long-term direction, with Te-auxiliary turning ideas into executable plans. Independent and goal-driven, prefers to think things through alone before acting, and has little patience for inefficiency and ambiguity."}, "INTP": {"zh": "逻辑学家", "en": "Logician", "dzh": "Ti 主导：追求概念的内在一致性，喜欢拆解问题到最底层原理。Ne 辅助发散新可能，是典型\"想得深、发散广\"的思考者，重视精确表达。", "den": "Ti-dominant: pursues internal consistency of concepts and loves breaking problems down to first principles. Ne-auxiliary branches out new possibilities — the classic “thinks deep, branches wide” thinker who values precise expression."}, "ISFJ": {"zh": "守卫者", "en": "Defender", "dzh": "Si 主导：重视传统与承诺，细心体贴地照顾身边人。Fe 辅助对他人需求高度敏感，默默付出、可靠低调，是值得信赖的后盾。", "den": "Si-dominant: values tradition and commitment, caring attentively for those around. Fe-auxiliary is highly sensitive to others’ needs — quietly devoted, reliable and low-key, a trustworthy backbone."}, "ISFP": {"zh": "探险家", "en": "Adventurer", "dzh": "Fi 主导：内心有清晰的审美与价值观，低调而有主见。Se 辅助活在当下、享受感官体验，用行动而非言语表达自我。", "den": "Fi-dominant: a clear inner aesthetic and values, low-key yet opinionated. Se-auxiliary lives in the moment and savors sensory experience, expressing self through action rather than words."}, "ISTJ": {"zh": "物流师", "en": "Logistician", "dzh": "Si 主导：依赖经验与既定流程，做事稳妥可靠、注重细节。Te 辅助把标准高效落地，是团队里\"说到做到\"的稳定器。", "den": "Si-dominant: relies on experience and established procedures, steady and detail-oriented. Te-auxiliary executes standards efficiently — the team’s “say it, do it” stabilizer."}, "ISTP": {"zh": "鉴赏家", "en": "Virtuoso", "dzh": "Ti 主导：冷静务实，喜欢动手钻研事物的运行原理。Se 辅助提供敏锐的现场感知与动手能力，遇事不慌、随机应变，是解决问题的高手。", "den": "Ti-dominant: calm and pragmatic, loves hands-on exploration of how things work. Se-auxiliary provides sharp situational awareness and hands-on skill — unflappable and adaptable, a master problem-solver."}};
var DIMS = ["EI", "SN", "TF", "JP"];
var DIM_KEYS = { EI: ["E", "I"], SN: ["S", "N"], TF: ["T", "F"], JP: ["J", "P"] };

function round4(x) { return Math.round(x * 10000) / 10000; }

/* answers: array of 38 integers 1..6 in question-id order */
function computeScore(answers, lang) {
  if (answers === null || answers === undefined) {
    return { error: "missing required query parameter 'a': 38 integers 1-6 separated by ',' or '-'" };
  }
  if (answers.length !== 38) {
    return { error: "parameter 'a' must contain exactly 38 values, got " + answers.length };
  }
  var total = { EI: 0, SN: 0, TF: 0, JP: 0, AT: 0 };
  for (var i = 0; i < 38; i++) {
    var v = answers[i];
    if (typeof v !== "number" || !isFinite(v) || Math.floor(v) !== v || v < 1 || v > 6) {
      return { error: "value at position " + (i + 1) + " must be an integer 1-6, got " + String(v) };
    }
    var q = QUESTIONS[i];
    total[q[1]] += (7 - v) * q[2];   /* s = 7 - a : agreement strength */
  }

  var type = "", ratio = {}, weak = [];
  for (var d = 0; d < DIMS.length; d++) {
    var dim = DIMS[d], k = DIM_KEYS[dim];
    var r = (total[dim] + 48) / 96;          /* 8 items per dimension -> max 48 */
    ratio[dim] = round4(r);
    if (r > 0.42 && r < 0.58) { weak.push(dim); }
    type += (r >= 0.5 ? k[0] : k[1]);
  }
  var rAt = (total.AT + 36) / 72;            /* 6 items -> max 36 */
  ratio.AT = round4(rAt);
  var at = rAt >= 0.5 ? "A" : "T";
  var low = type.toLowerCase();

  var out = {
    spec_version: SPEC_VERSION,
    mode: "likert",
    type: type,
    at: at,
    code: type + "-" + at,
    name_zh: TYPES[type].zh,
    name_en: TYPES[type].en,
    stack: STACKS[type],
    ratio: ratio,
    weak_dims: weak,
    profile_url_zh: SITE + "/types/" + low + ".html",
    profile_url_en: SITE + "/en/types/" + low + ".html",
    cite: "MBTI Cognitive Function Test \u2014 " + SITE + "/"
  };
  if (lang === "zh") { out.lang = "zh"; out.summary = TYPES[type].dzh; }
  else if (lang === "en") { out.lang = "en"; out.summary = TYPES[type].den; }
  return out;
}

function parseAnswers(raw) {
  if (raw === null || raw === undefined) { return null; }
  var parts = String(raw).split(/[,\-\s]+/), vals = [];
  for (var i = 0; i < parts.length; i++) { if (parts[i] !== "") { vals.push(Number(parts[i])); } }
  return vals;
}

function getParam(qs, name) {
  var pairs = qs.replace(/^\?/, "").split("&");
  for (var i = 0; i < pairs.length; i++) {
    var kv = pairs[i].split("=");
    if (decodeURIComponent(kv[0]) === name) {
      return kv.length > 1 ? decodeURIComponent(kv.slice(1).join("=")) : "";
    }
  }
  return null;
}

if (typeof document !== "undefined" && document.getElementById) {
  document.addEventListener("DOMContentLoaded", function () {
    var qs = (typeof location !== "undefined" && location.search) ? location.search : "";
    var lang = (getParam(qs, "lang") || "").toLowerCase();
    var out = computeScore(parseAnswers(getParam(qs, "a")), lang);
    var txt = JSON.stringify(out, null, 2);
    document.getElementById("out").textContent = txt;
    document.title = out.error ? "MBTI-ERROR" : "MBTI-" + out.code;
    var meta = document.querySelector('meta[name="mbti-result"]');
    if (meta) { meta.setAttribute("content", txt); }
  });
}
</script>
</head>

<noscript>
<h1>MBTI score endpoint — JavaScript required</h1>
<p><strong>This endpoint renders its JSON with JavaScript.</strong> With JS disabled the response body stays empty; fetch it with a runtime that executes scripts, or compute the score yourself with the formula below.</p>
<h2>Scoring formula (identical to ai/spec.md)</h2>
<pre>
1. Answers a[1..38], each an integer 1..6 (1 = strongly agree, 6 = strongly disagree).
2. Agreement strength: s_i = 7 - a_i          (so s = 6 means strongly agree)
3. Per dimension totals (dir_i is given in ai/questions.json):
     total[EI] = sum over its 8 items of s_i * dir_i      same for SN, TF, JP (8 items each)
     total[AT] = sum over its 6 items of s_i * dir_i
4. Ratios:
     r[dim] = (total[dim] + 48) / 96      for EI, SN, TF, JP
     r[AT]  = (total[AT] + 36) / 72
5. Letters: for each of EI, SN, TF, JP -> first letter if r >= 0.5, else second letter.
   AT: "A" if r[AT] >= 0.5, else "T".
6. weak_dims = dimensions with 0.42 < r < 0.58 (low confidence band).
7. code = 4-letter type + "-" + AT letter. Ratio values are rounded to 4 decimals.
</pre>
<h2>Reference</h2>
<p>Full machine specification, question list and JSON schema: <a href="spec.md">ai/spec.md</a> · raw questions: <a href="questions.json">ai/questions.json</a> · type profiles: <a href="result/intj.json">ai/result/{type}.json</a></p>
<p>Example: <code>score.html?a=3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3</code></p>
</noscript>
