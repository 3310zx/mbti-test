<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 认知功能测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============ Material 3 / Monet 印象派调色 ============
     默认主题取莫奈《日出·印象》的晨蓝调；
     四个维度分别使用莫奈画作中提炼的柔和印象派色：
     EI 能量来源 -> 睡莲水面蓝 / SN 信息获取 -> 吉维尼花园绿
     TF 决策方式 -> 日出暖橙粉   / JP 生活方式 -> 干草堆晨光紫   */
  :root {
    --md-primary: #6E8FB8;            /* 莫奈晨蓝 */
    --md-on-primary: #FFFFFF;
    --md-primary-container: #DCE7F3;
    --md-on-primary-container: #14283F;
    --md-secondary: #626B78;
    --md-secondary-container: #E3E9F1;
    --md-surface: #FCFAF6;
    --md-surface-container-low: #F6F3EE;
    --md-surface-container: #F1EEE8;
    --md-on-surface: #201E1A;
    --md-on-surface-variant: #4C4742;
    --md-outline: #7B756E;
    --md-outline-variant: #C9C3BA;
    --md-warning: #9A4A32;
    --md-warning-container: #FFDBD0;
    --elev-1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
    --elev-2: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
    --radius: 12px;
    --radius-pill: 20px;
  }
  /* —— 维度主题（Monet 印象派取色） —— */
  .theme-ei { --md-primary:#5B8DC6; --md-on-primary:#FFFFFF; --md-primary-container:#DBEAF7; --md-on-primary-container:#12324F; --md-secondary-container:#D2E2F2; }
  .theme-sn { --md-primary:#5F8F6B; --md-on-primary:#FFFFFF; --md-primary-container:#DDEBDD; --md-on-primary-container:#15301D; --md-secondary-container:#D2E6D2; }
  .theme-tf { --md-primary:#C97B56; --md-on-primary:#FFFFFF; --md-primary-container:#F7E1D4; --md-on-primary-container:#4C2310; --md-secondary-container:#F2DDD1; }
  .theme-jp { --md-primary:#8D79B5; --md-on-primary:#FFFFFF; --md-primary-container:#E8E0F4; --md-on-primary-container:#241A3E; --md-secondary-container:#E3DAF0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Roboto", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
    background: var(--md-surface-container); color: var(--md-on-surface);
    line-height: 1.7; min-height: 100vh;
    transition: background .4s ease;
  }

  .appbar { position: sticky; top: 0; z-index: 10; background: var(--md-surface); box-shadow: var(--elev-1); }
  .appbar-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .appbar-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .appbar-title { font-size: 17px; font-weight: 500; letter-spacing: .2px; }
  .appbar-sub { font-size: 12px; color: var(--md-on-surface-variant); font-weight: 400; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }

  .card {
    background: var(--md-surface); border-radius: var(--radius);
    box-shadow: var(--elev-1); padding: 24px; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

  .btn {
    border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1px;
    padding: 0 24px; height: 40px; border-radius: var(--radius-pill);
    display: inline-flex; align-items: center; justify-content: center;
    transition: box-shadow .15s, background .15s, opacity .15s; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { box-shadow: var(--elev-2); }
  .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
  .btn-filled:disabled { background: var(--md-outline-variant); color: rgba(32,30,26,.38); box-shadow: none; cursor: not-allowed; }
  .btn-tonal { background: var(--md-secondary-container); color: var(--md-on-surface); }
  .btn-text { background: transparent; color: var(--md-primary); padding: 0 12px; }
  .btn-text:hover { background: rgba(110,143,184,.10); }

  .progress { height: 4px; background: var(--md-outline-variant); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
  .progress > div { height: 100%; background: var(--md-primary); border-radius: 999px; transition: width .3s ease, background .4s ease; }

  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .chip {
    font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 8px;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
  }
  .q-count { font-size: 12px; color: var(--md-on-surface-variant); }
  .q-text { font-size: 18px; font-weight: 500; margin-bottom: 8px; letter-spacing: .1px; }
  .q-hint { font-size: 13px; color: var(--md-on-surface-variant); margin-bottom: 18px; }

  .likert { display: flex; gap: 10px; flex-wrap: wrap; }
  .likert button {
    flex: 1 1 15%; min-width: 100px; padding: 12px 6px;
    background: var(--md-surface); color: var(--md-on-surface);
    border: 1px solid var(--md-outline-variant); border-radius: var(--radius);
    cursor: pointer; font-family: inherit; text-align: center;
    transition: background .15s, border-color .15s, box-shadow .15s; -webkit-tap-highlight-color: transparent;
  }
  .likert button:hover { background: var(--md-surface-container-low); }
  .likert button .v { display: block; font-size: 16px; font-weight: 700; color: var(--md-primary); }
  .likert button .l { display: block; font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; }
  .likert button.sel { background: var(--md-primary); border-color: var(--md-primary); box-shadow: var(--elev-2); }
  .likert button.sel .v { color: var(--md-on-primary); }
  .likert button.sel .l { color: var(--md-on-primary); font-weight: 500; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .nav .spacer { flex: 1; }

  #result { display: none; }
  .result-head { text-align: center; }
  .type-letters {
    font-size: 46px; font-weight: 700; letter-spacing: 6px;
    color: var(--md-primary); margin: 8px 0 4px; transition: color .4s ease;
  }
  .type-name { font-size: 16px; color: var(--md-on-surface-variant); margin-bottom: 8px; }
  .type-desc { font-size: 15px; text-align: left; padding: 0 8px; }

  /* 历史人物卡 */
  .figure-card {
    margin-top: 20px; padding: 16px 18px; border-radius: var(--radius);
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    text-align: left; border-left: 5px solid var(--md-primary);
  }
  .figure-card .fig-label { font-size: 12px; font-weight: 500; opacity: .75; letter-spacing: .5px; }
  .figure-card .fig-name { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .figure-card .fig-desc { font-size: 13.5px; opacity: .9; margin-top: 4px; }

  /* 激励文本 */
  .motivation-card {
    margin-top: 16px; padding: 20px 22px; border-radius: var(--radius);
    background: var(--md-surface); border: 1px solid var(--md-outline-variant);
    text-align: left;
  }
  .motivation-card .mot-label { font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); letter-spacing: .5px; margin-bottom: 8px; }
  .motivation-card .mot-text { font-size: 15.5px; line-height: 2; color: var(--md-on-surface); }

  .stack-title { font-size: 13px; font-weight: 500; color: var(--md-on-surface-variant); margin: 24px 0 10px; text-align: left; }
  .stack { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .stack .fn {
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    background: var(--md-secondary-container); color: var(--md-on-surface);
  }
  .stack .fn.dim { opacity: .38; }

  .bar-row { text-align: left; margin-bottom: 16px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .bar-row .bar-label .dim2 { color: var(--md-on-surface-variant); font-weight: 400; }
  .bar-track { height: 6px; background: var(--md-outline-variant); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--md-primary); transition: width .4s ease; }
  .bar-fill.tie { background: var(--md-warning); }

  .tie-note {
    font-size: 13px; color: var(--md-warning); background: var(--md-warning-container);
    border-radius: var(--radius); padding: 12px 16px; text-align: left; margin-top: 20px;
  }

  .ad-box { margin-top: 20px; min-height: 90px; }
  .ad-placeholder {
    width: 100%; height: 90px; border: 1.5px dashed var(--md-outline-variant); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    color: var(--md-outline); font-size: 12px; background: var(--md-surface);
  }

  .disclaimer {
    font-size: 12px; color: var(--md-on-surface-variant); margin-top: 24px; text-align: left;
    background: var(--md-surface); border: 1px solid var(--md-outline-variant);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .again { margin-top: 24px; text-align: center; }

  @media (max-width: 600px) {
    .wrap { padding: 16px 14px 60px; }
    .appbar-inner { padding: 12px 16px; }
    .card { padding: 20px 16px; }
    .q-text { font-size: 16px; }
    .likert { gap: 8px; }
    .likert button { flex: 1 1 30%; min-width: 0; padding: 10px 4px; }
    .likert button .v { font-size: 15px; }
    .likert button .l { font-size: 11px; }
    .nav button { flex: 1; }
    .type-letters { font-size: 36px; letter-spacing: 4px; }
    .stack .fn { font-size: 12px; padding: 6px 10px; }
    .bar-label { font-size: 12px; }
  }
  @media (max-width: 380px) {
    .likert button .l { font-size: 10px; }
    .likert { gap: 6px; }
  }
</style>
</head>
<body>

  <div class="appbar">
    <div class="appbar-inner">
      <div class="appbar-icon">M</div>
      <div>
        <div class="appbar-title">MBTI 认知功能测试</div>
        <div class="appbar-sub">程度评分 · 规避巴纳姆效应 · 莫奈配色</div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div id="start">
      <div class="card">
        <div class="q-text" style="font-size:16px;font-weight:500;">
          每个维度 8 道陈述题，采用 6 级程度评分（无"不确定"中间项，强制你做出倾向）。
          计分基于 MBTI 底层认知功能，交叉验证、逐题加权。四个维度用莫奈印象派配色区分，
          结果页为你匹配一位同类型的历史巨匠与一段专属激励。
        </div>
        <div style="text-align:center;margin-top:28px;">
          <button class="btn btn-filled" onclick="startTest()" style="height:44px;padding:0 40px;font-size:15px;">开始测试</button>
        </div>
      </div>
      <div class="ad-box" id="ad-start"></div>
    </div>

    <div id="quiz" style="display:none;">
      <div class="progress"><div id="progressBar" style="width:0%"></div></div>
      <div class="card">
        <div class="q-meta">
          <span class="chip" id="dimTag"></span>
          <span class="q-count" id="qCount"></span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="q-hint">你对这句话的认同程度：</div>
        <div class="likert" id="likert"></div>
      </div>
      <div class="nav">
        <button class="btn btn-text" id="prevBtn" onclick="prev()">上一题</button>
        <span class="spacer"></span>
        <button class="btn btn-filled" id="nextBtn" onclick="next()" disabled>下一题</button>
      </div>
      <div class="ad-box" id="ad-quiz"></div>
    </div>

    <div id="result">
      <div class="card" id="resultCard">
        <div class="result-head">
          <div id="typeLetters" class="type-letters"></div>
          <div id="typeName" class="type-name"></div>
        </div>
        <div class="type-desc" id="typeDesc"></div>

        <div class="figure-card" id="figureCard">
          <div class="fig-label">与你同类型的历史巨匠</div>
          <div class="fig-name" id="figName"></div>
          <div class="fig-desc" id="figDesc"></div>
        </div>

        <div class="motivation-card">
          <div class="mot-label">给你的话</div>
          <div class="mot-text" id="motText"></div>
        </div>

        <div class="stack-title">认知功能栈（主导 → 劣势）</div>
        <div class="stack" id="stackBox"></div>
        <div id="bars"></div>
        <div id="tieNote" class="tie-note" style="display:none;"></div>
      </div>
      <div class="ad-box" id="ad-result"></div>
      <div class="disclaimer">
        <b>提示：</b>MBTI 属于职业测评工具而非心理诊断，其结果仅供自我认知参考，不构成科学定论。
        程度评分能降低作答噪声，但仍受主观偏差影响；若某维度倾向 &lt;58%，建议结合功能描述或换时重测复核。
      </div>
      <div class="again">
        <button class="btn btn-tonal" onclick="location.reload()">重新测试</button>
      </div>
    </div>

  </div>

<script>

var DIMS = ['EI','SN','TF','JP'];
var DIM_KEYS = { EI:['E','I'], SN:['S','N'], TF:['T','F'], JP:['J','P'] };
var DIM_THEME = { EI:'theme-ei', SN:'theme-sn', TF:'theme-tf', JP:'theme-jp' };

var TYPE_INFO = {

    figure:'阿尔伯特·爱因斯坦', fdesc:'相对论创立者，改变了人类对时间、空间与引力的理解。',
    mot:'世界在你眼里是一台等待拆解的机器，而你从不满足于表面的齿轮。像爱因斯坦用想象撬动时空，保持对"为什么"的执拗追问——正是那些看似无用的好奇，最终改变了人类认知的边界。' },
  ENTJ:{ name:'指挥官', desc:'Te 主导：执行力与组织力突出，善于调动资源、推进目标。Ni 辅助提供战略眼光，天生适合带团队和攻坚，讨厌失控与低效。',
    figure:'拿破仑·波拿巴', fdesc:'法国军事家与政治家，以超凡的统帅力重塑了欧洲版图。',
    mot:'你天生就该站在指挥的位置。像拿破仑一样，用清晰的判断与果断的行动，把混乱变成秩序、把愿景变成版图。被误解、被畏惧都在所难免——历史只记得谁真正推动了它。' },
  ENTP:{ name:'辩论家', desc:'Ne 主导：思维活跃、点子层出不穷，喜欢挑战既有框架。Ti 辅助把想法打磨成严密论证，享受思想交锋，但对重复性事务缺乏耐心。',
    figure:'列奥纳多·达·芬奇', fdesc:'文艺复兴通才，横跨艺术、科学与工程，思想的边界从未设限。',
    mot:'每一个"不可能"对你都是邀请函。像达·芬奇那样同时推开艺术与科学两扇门，你的头脑从不受限于单一领域。别停下试探规则的脚步，颠覆者正是下一个时代的定义者。' },
  INFJ:{ name:'提倡者', desc:'Ni 主导：对人与事有深刻洞察和使命感，Fe 辅助敏锐体察他人情绪。理想主义且坚定，常常默默推动自己相信的改变。',
    figure:'圣雄甘地', fdesc:'印度独立运动领袖，以非暴力抵抗撼动了殖民统治。',
    mot:'你相信温和可以撼动铁石，信念可以改写时代。像甘地一样，用非暴力的坚持赢下历史——真正的力量从不喧嚣。守护你内心的理想主义，它终将照亮比想象更远的地方。' },
  INFP:{ name:'调停者', desc:'Fi 主导：价值观和个人信念是第一行动准则，忠于内心。Ne 辅助在理想与现实间探索可能性，同理心强，追求有意义的工作与生活。',
    figure:'J.R.R.托尔金', fdesc:'《魔戒》作者，现代奇幻文学之父，用想象构建了一个完整的世界。',
    mot:'你内心的世界远比现实辽阔。像托尔金那样，把理想与诗意种进文字，让一代代人从中获得勇气。别嫌自己太柔软——能塑造信仰的，从来不是坚硬，而是真诚。' },
  ENFJ:{ name:'主人公', desc:'Fe 主导：擅长理解、感染并凝聚他人，是天生的组织者与激励者。Ni 辅助看清团队方向，乐于成就别人，社交中自带温暖气场。',
    figure:'纳尔逊·曼德拉', fdesc:'南非前总统，反种族隔离领袖，用宽容弥合了国家的裂痕。',
    mot:'你天生懂得如何把一群人凝聚成一股力量。像曼德拉那样，用宽容与远见弥合裂痕、赢得历史。你的能量不只是成就自己，更是让身边每个人都成为更好的人。' },
  ENFP:{ name:'竞选者', desc:'Ne 主导：热情、好奇、脑洞大，对人和新事物充满兴趣。Fi 辅助在众多可能中捕捉真正打动自己的那一个，适合创意与连接型工作。',
    figure:'沃尔特·迪士尼', fdesc:'迪士尼公司创始人，动画产业先驱，把"白日梦"做成了亿万人的童年。',
    mot:'你把"白日梦"做成了帝国。像迪士尼那样，用热情与想象力构建无数人童年的奇迹——敢想，就是你最锋利的武器。别让现实磨平你的火花，世界需要你的异想天开。' },
  ISTJ:{ name:'物流师', desc:'Si 主导：依赖经验与既定流程，做事稳妥可靠、注重细节。Te 辅助把标准高效落地，是团队里"说到做到"的稳定器。',
    figure:'乔治·华盛顿', fdesc:'美国首任总统，以自律与担当为一个新生国家立下根基。',
    mot:'历史常常由喧嚣者书写，但稳固的基座永远由你这样的可靠者铸就。像华盛顿一样，用责任与自律托起一个国家的清晨。别低估"稳定"的力量——持久，本就是最深的伟大。' },
  ISFJ:{ name:'守卫者', desc:'Si 主导：重视传统与承诺，细心体贴地照顾身边人。Fe 辅助对他人需求高度敏感，默默付出、可靠低调，是值得信赖的后盾。',
    figure:'特蕾莎修女', fdesc:'慈善工作者，诺贝尔和平奖得主，把一生献给最微小的善举。',
    mot:'你相信微小的善意足以改变世界。像特蕾莎修女那样，把温暖送给每一个具体的人——你的伟大不在聚光灯下，而在一次次默默付出里。世界因你这样的守护者而值得留恋。' },
  ESTJ:{ name:'总经理', desc:'Te 主导：务实高效，善于制定规则并推动执行。Si 辅助提供扎实的经验参照，适合管理和组织场景，重视秩序与结果。',
    figure:'亨利·福特', fdesc:'福特汽车创始人，流水线生产的先驱，让汽车驶入千家万户。',
    mot:'你把"效率"变成了时代的引擎。像福特一样，用秩序与实干让曾经奢侈的梦想走进千家万户。别怀疑规则的价值——能落地的秩序，就是改变世界最朴素的力量。' },
  ESFJ:{ name:'执政官', desc:'Fe 主导：热心组织社群、协调关系，关注他人感受与和谐氛围。Si 辅助在熟悉圈子里游刃有余，是天然的"润滑剂"与召集人。',
    figure:'伊丽莎白二世', fdesc:'英国女王，在位 70 年，以一生的坚守成为时代的稳定坐标。',
    mot:'你用一生的坚守诠释了何为责任。像女王那样，在变化的世界里成为稳定的坐标——你的影响力不在声势，而在让人安心的存在本身。真诚地连接每一个人，就是你的王冠。' },
  ISTP:{ name:'鉴赏家', desc:'Ti 主导：冷静务实，喜欢动手钻研事物的运行原理。Se 辅助提供敏锐的现场感知与动手能力，遇事不慌、随机应变，是解决问题的高手。',
    figure:'迈克尔·乔丹', fdesc:'篮球传奇，六届 NBA 总冠军，用关键表现定义了"伟大"。',
    mot:'你从不空谈，只用结果说话。像乔丹那样，在关键时刻站出来、把不可能投进篮筐——冷静与果断是你最锋利的武器。别怕挑战，你就是为高压瞬间而生的人。' },
  ISFP:{ name:'探险家', desc:'Fi 主导：内心有清晰的审美与价值观，低调而有主见。Se 辅助活在当下、享受感官体验，用行动而非言语表达自我。',
    figure:'沃尔夫冈·莫扎特', fdesc:'古典音乐大师，用天赋与情感谱写了传世旋律。',
    mot:'你用自己的方式，把内心谱成了世界无法忘怀的旋律。像莫扎特那样，用天赋与真诚打动每一个聆听者——不必迎合标准，你独有的色彩就是最动人的作品。' },
  ESTP:{ name:'企业家', desc:'Se 主导：反应快、行动力强，擅长把握当下机会。Ti 辅助在实战中快速推理，喜欢刺激与挑战，天生适合高压应变场景。',
    figure:'欧内斯特·海明威', fdesc:'作家，《老人与海》作者，用行动与文字定义硬汉精神。',
    mot:'你信奉行动胜过言辞，此刻胜过永远。像海明威那样，用果敢与生命力写就传奇——世界不是用来围观的，是用来亲身征服的。别犹豫，冲进去，把当下活成巅峰。' },
  ESFP:{ name:'表演者', desc:'Se 主导：热情外向，享受当下并感染周围人。Fi 辅助在热闹中保持对自我的忠诚，是气氛担当与体验派。',
    figure:'埃尔维斯·普雷斯利', fdesc:'摇滚乐之王，用感染力点燃了一个时代。',
    mot:'你天生知道如何让全场为你沸腾。像猫王一样，用热情与感染力点燃每一个瞬间——你的舞台不设限，你的快乐会传染。别收敛自己，尽情发光，世界需要这样的生命力。' },
};
var FN_NAME = { Ni:'直觉内倾', Ne:'直觉外倾', Ti:'思考内倾', Te:'思考外倾',
  Fi:'情感内倾', Fe:'情感外倾', Si:'感觉内倾', Se:'感觉外倾' };

var SCALE = [
  { v:1, l:'完全同意' }, { v:2, l:'同意' }, { v:3, l:'略同意' },
  { v:4, l:'略不同意' }, { v:5, l:'不同意' }, { v:6, l:'完全不同意' }
];

var cur = 0;
var answers = new Array(QUESTIONS.length).fill(null);

function startTest(){
  document.getElementById('start').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  render();
}
function dimName(d){ return { EI:'能量来源', SN:'信息获取', TF:'决策方式', JP:'生活方式' }[d]; }

function applyTheme(cls){
  var quiz = document.getElementById('quiz');
  DIMS.forEach(function(d){ quiz.classList.remove(DIM_THEME[d]); });
  if(cls) quiz.classList.add(cls);
}

function render(){
  var q = QUESTIONS[cur];
  document.getElementById('dimTag').textContent = dimName(q.dim);
  document.getElementById('qCount').textContent = (cur+1) + ' / ' + QUESTIONS.length;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = ((cur+1)/QUESTIONS.length*100) + '%';
  applyTheme(DIM_THEME[q.dim]);

  var lb = document.getElementById('likert');
  lb.innerHTML = '';
  SCALE.forEach(function(opt){
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="v">' + opt.v + '</span><span class="l">' + opt.l + '</span>';
    if(answers[cur] === opt.v){ b.className = 'sel'; }
    b.onclick = (function(v){ return function(){ answer(v); }; })(opt.v);
    lb.appendChild(b);
  });

  document.getElementById('prevBtn').style.visibility = cur === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = cur === QUESTIONS.length-1 ? '查看结果' : '下一题';
  document.getElementById('nextBtn').disabled = answers[cur] === null;
}
function answer(v){
  answers[cur] = v;
  render();
  if(cur < QUESTIONS.length-1){ setTimeout(next, 160); }
}
function next(){
  if(cur < QUESTIONS.length-1){ cur++; render(); }
  else { showResult(); }
}
function prev(){ if(cur>0){ cur--; render(); } }

function showResult(){
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});

  var sum = {}, maxScore = {};
  DIMS.forEach(function(d){ sum[d] = 0; maxScore[d] = 0; });
  QUESTIONS.forEach(function(q, i){
    if(answers[i] === null) return;
    var t = 7 - answers[i];
    sum[q.dim] += t * q.dir;
    maxScore[q.dim] += 6;
  });

  var type = '';
  var weakDims = [];
  var dimResults = {};
  DIMS.forEach(function(d){
    var k = DIM_KEYS[d];
    var ratio = (sum[d] + maxScore[d]) / (2 * maxScore[d]);
    dimResults[d] = ratio;
    if(ratio < 0.58 && ratio > 0.42){ weakDims.push(dimName(d)); }
    type += (ratio >= 0.5 ? k[0] : k[1]);
  });

  var info = TYPE_INFO[type];
  document.getElementById('typeLetters').textContent = type;
  document.getElementById('typeName').textContent = info.name;
  document.getElementById('typeDesc').innerHTML = info.desc;
  document.getElementById('figName').textContent = info.figure;
  document.getElementById('figDesc').textContent = info.fdesc;
  document.getElementById('motText').textContent = info.mot;

  var stack = STACKS[type];
  var box = document.getElementById('stackBox');
  box.innerHTML = '';
  stack.forEach(function(fn, idx){
    var el = document.createElement('div');
    el.className = 'fn' + (idx>=2 ? ' dim' : '');
    el.textContent = fn + ' · ' + FN_NAME[fn];
    el.title = idx===0 ? '主导功能' : idx===1 ? '辅助功能' : idx===2 ? '第三功能' : '劣势功能';
    box.appendChild(el);
  });

  var bars = document.getElementById('bars');
  bars.innerHTML = '';
  DIMS.forEach(function(d){
    var k = DIM_KEYS[d];
    var ratio = dimResults[d];
    var pct = Math.round(ratio * 100);
    var weak = ratio < 0.58 && ratio > 0.42;
    var row = document.createElement('div');
    row.className = 'bar-row ' + DIM_THEME[d];
    row.innerHTML =
      '<div class="bar-label"><span>' + k[0] + ' ' + pct + '%</span>' +
      '<span class="dim2">' + dimName(d) + '</span>' +
      '<span class="dim2">' + k[1] + ' ' + (100-pct) + '%</span></div>' +
      '<div class="bar-track"><div class="bar-fill' + (weak ? ' tie' : '') + '" style="width:' + pct + '%"></div></div>';
    bars.appendChild(row);
  });

  var tie = document.getElementById('tieNote');
  if(weakDims.length > 0){
    tie.style.display = 'block';
    tie.innerHTML = '<b>注意：</b>「' + weakDims.join('、') + '」维度倾向 <58%，属于偏弱区间。' +
      '结果仍按常规倾向给出，建议对照功能描述自评，或换一天重测复核。';
  } else {
    tie.style.display = 'none';
  }
}

initAds();
</script>
