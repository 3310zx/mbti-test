name: indexnow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "sitemap-images.xml"
      - "country/sitemap*.xml"
      - "scripts/indexnow.py"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/indexnow.py
